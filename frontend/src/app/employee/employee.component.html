<div class="container">
  <div class="sub-container">
    <!-- Employee Form -->
    <div class="form-container">
      <!-- <h2 class="form-title">Employee Details</h2> -->

      <div class="input-container">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" [(ngModel)]="employeeId" name="employeeId" required
          [disabled]="isBusy || editingIndex !== null" />
      </div>

      <div class="input-container">
        <label for="employeeName">Employee Name</label>
        <input type="text" id="employeeName" [(ngModel)]="employeeName" name="employeeName" required
          [disabled]="isBusy" />
      </div>

      <div class="input-container">
        <label for="employeeEmail">Employee Email</label>
        <input type="email" id="employeeEmail" [(ngModel)]="employeeEmail" name="employeeEmail" required
          [disabled]="isBusy" />
      </div>

      <div class="input-container">
        <label for="division">Division</label>
        <select id="division" [(ngModel)]="selectedDivision" (change)="onDivisionChange()" name="division" required
          [disabled]="isBusy">
          <option value="" disabled selected>Select Division</option>
          <option *ngFor="let division of divisions" [value]="division.name">
            {{ division.name }}
          </option>
        </select>
      </div>

      <div class="input-container custom-multi-select">
        <label for="pc">PC</label>
        <div class="dropdown-box" [class.disabled]="!selectedDivision || isBusy"
          (click)="(!isBusy && selectedDivision) ? toggleDropdown() : showDivisionAlert()"
          [class.open]="dropdownOpen && selectedDivision && !isBusy">
          <span class="selected-text">
            {{ selectedPCs.length > 0 ? selectedPCs.join(', ') : 'Select PC(s)' }}
          </span>
          <span class="arrow"></span>
        </div>

        <div class="dropdown-list" *ngIf="dropdownOpen && selectedDivision && !isBusy">
          <label *ngFor="let pc of pcs">
            <input type="checkbox" [value]="pc.name" [checked]="selectedPCs.includes(pc.name)"
              (change)="onPCCheckboxChange(pc.name, $event)" [disabled]="isBusy" />
            {{ pc.name }}
          </label>
        </div>
      </div>

      <div class="input-container">
        <label for="team">Team</label>
        <select id="team" [(ngModel)]="selectedTeam" name="team" required [disabled]="isBusy">
          <option value="" disabled selected>Select Team</option>
          <option *ngFor="let team of teams" [value]="team.name">{{ team.name }}</option>
        </select>
      </div>

      <div class="add-btn">
        <button type="button" (click)="saveEmployee()" class="add-employee-button" [disabled]="isBusy">
          <img [src]="editingIndex !== null ? 'assets/save.svg' : 'assets/plus.svg'"
            alt="{{ editingIndex !== null ? 'Save' : 'Add' }}" class="button-icon" />
          <ng-container *ngIf="!isBusy; else busyTpl">
            {{ editingIndex !== null ? 'Save details' : 'Add employee' }}
          </ng-container>
        </button>
        <ng-template #busyTpl>Processing…</ng-template>
      </div>
    </div>

    <!-- Employee Table -->
    <div class="table-container">
      <h2 class="table-title">Employee List</h2>
      <table class="styled-table">
        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Division</th>
            <th>PC</th>
            <th>Team</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employee of employees; let i = index">
            <td>{{ employee.id }}</td>
            <td>{{ employee.name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.division }}</td>
            <td>{{ employee.pc }}</td>
            <td>{{ employee.team }}</td>
            <td class="actions">
              <img src="assets/edit-2.svg" alt="Edit" class="action-icon edit-icon" [class.disabled]="isBusy"
                (click)="!isBusy && editEmployee(i)" />
              <img src="assets/delete.svg" alt="Delete" class="action-icon delete-icon" [class.disabled]="isBusy"
                (click)="!isBusy && deleteEmployee(i)" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
