<div class="report-header">
  <!-- Report Type Selection -->
  <div class="input-container">
    <label for="reportType">Report Type</label>
    <select id="reportType" (change)="onReportChange($event)">
      <option value="monthly" selected>Monthly Report</option>
      <option value="trend">Trend Report</option>
      <option value="passRatio">Pass Ratio Report</option>
      <option value="employeeReport">Employee Report</option>
      <option value="drawingReport">Drawing Report</option>
      <option value="taskReport">Task Report</option>
    </select>
  </div>

  <!-- Team Dropdown -->
  <div class="dropdown-container" *ngIf="showTeamDropdown">
    <label>Team</label>
    <div class="dropdown-box" (click)="showTeams = !showTeams; showPCs = false">
      {{ getSelectedTeamsDisplay() }}
      <span class="arrow">▼</span>
    </div>
    <div class="dropdown-list" *ngIf="showTeams">
      <div class="dropdown-actions" style="padding: 5px; display: flex; gap: 5px; border-bottom: 1px solid #eee;">
        <button (click)="selectAllTeams()" style="font-size: 0.8em; padding: 2px 5px; cursor: pointer;">All</button>
        <button (click)="deselectAllTeams()" style="font-size: 0.8em; padding: 2px 5px; cursor: pointer;">None</button>
      </div>
      <label class="dropdown-item" *ngFor="let team of teams"
        style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" [checked]="selectedTeams.includes(team.name)" (change)="toggleTeam(team.name)"
          (click)="$event.stopPropagation()">
        {{ team.name }}
      </label>
    </div>
  </div>

  <!-- PC Dropdown -->
  <div class="dropdown-container" *ngIf="showPCDropdown">
    <label>PC</label>
    <div class="dropdown-box" (click)="showPCs = !showPCs; showTeams = false">
      {{ getSelectedPCsDisplay() }}
      <span class="arrow">▼</span>
    </div>
    <div class="dropdown-list" *ngIf="showPCs">
      <div class="dropdown-actions" style="padding: 5px; display: flex; gap: 5px; border-bottom: 1px solid #eee;">
        <button (click)="selectAllPCs()" style="font-size: 0.8em; padding: 2px 5px; cursor: pointer;">All</button>
        <button (click)="deselectAllPCs()" style="font-size: 0.8em; padding: 2px 5px; cursor: pointer;">None</button>
      </div>
      <label class="dropdown-item" *ngFor="let pc of pcs"
        style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" [checked]="selectedPCs.includes(pc.name)" (change)="togglePC(pc.name)"
          (click)="$event.stopPropagation()">
        {{ pc.name }}
      </label>
    </div>
  </div>

  <!-- Employee ID Dropdown with Search -->
  <div class="dropdown-container" *ngIf="showEmployeeDropdown">
    <label>Employee ID</label>
    <input class="dropdown-box" type="text" [(ngModel)]="empSearch" (focus)="showEmployees = true"
      (input)="filterEmployees()" placeholder="Search by Name or Employee ID" />
    <div class="dropdown-list" *ngIf="showEmployees">
      <div class="dropdown-item" *ngFor="let emp of filteredEmployees" (click)="selectEmployee(emp)">
        {{ emp }}
      </div>
    </div>
  </div>

  <!-- Drawing ID Dropdown with Search -->
  <div class="dropdown-container" *ngIf="showDrawingIdDropdown">
    <label>Drawing ID</label>
    <input class="dropdown-box" type="text" [(ngModel)]="drawingSearch" (focus)="showDrawings = true"
      (input)="filterDrawings()" placeholder="Select or Type Drawing ID" />
    <div class="dropdown-list" *ngIf="showDrawings">
      <div class="dropdown-item" *ngFor="let drawing of filteredDrawings" (click)="selectDrawing(drawing)">
        {{ drawing }}
      </div>
    </div>
  </div>

  <!-- Start Date -->
  <div class="input-container">
    <label for="fromDate">Start Date</label>
    <input id="fromDate" type="date" (change)="onDateChange($event, 'start')" />
  </div>

  <!-- End Date -->
  <div class="input-container">
    <label for="toDate">End Date</label>
    <input id="toDate" type="date" (change)="onDateChange($event, 'end')" />
  </div>
</div>

<!-- Charts Section -->
<div class="charts-container">
  <div class="column-chart">
    <app-column-chart *ngIf="selectedReport === 'monthly'" [selectedTeam]="selectedTeams" [selectedPC]="selectedPCs"
      [startDate]="startDate" [endDate]="endDate">
    </app-column-chart>

    <app-report-table *ngIf="selectedReport === 'employeeReport' || selectedReport === 'drawingReport' || selectedReport === 'taskReport'"
      [reportType]="selectedReport" [employeeId]="selectedEmpId" [drawingId]="selectedDrawingId" [startDate]="startDate"
      [endDate]="endDate" [selectedTeam]="selectedTeams">
    </app-report-table>

    <app-line-chart *ngIf="selectedReport === 'trend'" [selectedTeam]="selectedTeams" [selectedPC]="selectedPCs"
      [startDate]="startDate" [endDate]="endDate">
    </app-line-chart>

    <app-table *ngIf="selectedReport === 'passRatio'" [selectedTeam]="selectedTeams" [selectedPC]="selectedPCs"
      [startDate]="startDate" [endDate]="endDate">
    </app-table>
  </div>

  <div class="bar-chart">
    <app-bar-chart *ngIf="selectedReport === 'monthly' || selectedReport === 'trend'" [reportType]="selectedReport"
      [selectedTeam]="selectedTeams" [selectedPC]="selectedPCs" [startDate]="startDate" [endDate]="endDate">
    </app-bar-chart>

    <app-report-charts *ngIf="selectedReport === 'employeeReport' || selectedReport === 'drawingReport'"
      [reportType]="selectedReport" [employeeId]="selectedEmpId" [drawingId]="selectedDrawingId" [startDate]="startDate"
      [endDate]="endDate">
    </app-report-charts>
  </div>
</div>
