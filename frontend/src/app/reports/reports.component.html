<div class="report-header">
  <!-- Report Type Selection -->
  <div class="input-container">
    <label for="reportType">Report Type</label>
    <select id="reportType" (change)="onReportChange($event)">
      <option value="monthly" selected>Monthly Report</option>
      <option value="trend">Trend Report</option>
      <option value="passRatio">Pass Ratio Report</option>
      <option value="employeeReport">Employee Report</option>
      <option value="drawingReport">Drawing Report</option>
    </select>
  </div>

  <!-- Division Dropdown -->
  <div class="dropdown-container" *ngIf="showDefaultDropdowns">
    <label>Division</label>
    <div class="dropdown-box" (click)="showDivisions = !showDivisions">
      {{ selectedDivision || 'Select Division' }}
    </div>
    <div class="dropdown-list" *ngIf="showDivisions">
      <div class="dropdown-item" *ngFor="let div of divisions" (click)="selectDivision(div)">
        {{ div }}
      </div>
    </div>
  </div>

  <!-- PC Dropdown -->
  <div class="dropdown-container" *ngIf="showDefaultDropdowns">
    <label>PC</label>
    <div class="dropdown-box" (click)="showPCs = !showPCs">
      {{ selectedPC || 'Select PC' }}
    </div>
    <div class="dropdown-list" *ngIf="showPCs">
      <div class="dropdown-item" *ngFor="let pc of pcs" (click)="selectPC(pc)">
        {{ pc }}
      </div>
    </div>
  </div>

  <!-- Employee ID Dropdown with Search -->
  <div class="dropdown-container" *ngIf="showEmployeeDropdown">
    <label>Employee ID</label>
    <div class="dropdown-box" (click)="showEmployees = !showEmployees">
      {{ selectedEmpId || 'Select Employee ID' }}
    </div>
    <div class="dropdown-list" *ngIf="showEmployees">
      <input class="dropdown-search" type="text" [(ngModel)]="empSearch" (input)="filterEmployees()" placeholder="Search..." />
      <div class="dropdown-item" *ngFor="let emp of filteredEmployees" (click)="selectEmployee(emp)">
        {{ emp }}
      </div>
    </div>
  </div>

  <!-- Drawing ID Dropdown with Search -->
  <div class="dropdown-container" *ngIf="showDrawingIdDropdown">
    <label>Drawing ID</label>
    <div class="dropdown-box" (click)="showDrawings = !showDrawings">
      {{ selectedDrawingId || 'Select Drawing ID' }}
    </div>
    <div class="dropdown-list" *ngIf="showDrawings">
      <input class="dropdown-search" type="text" [(ngModel)]="drawingSearch" (input)="filterDrawings()" placeholder="Search..." />
      <div class="dropdown-item" *ngFor="let drawing of filteredDrawings" (click)="selectDrawing(drawing)">
        {{ drawing }}
      </div>
    </div>
  </div>

  <!-- Start Date -->
  <div class="input-container">
    <label for="fromDate">Start Date</label>
    <input id="fromDate" type="date" (change)="onDateChange($event, 'start')" />
  </div>

  <!-- End Date -->
  <div class="input-container">
    <label for="toDate">End Date</label>
    <input id="toDate" type="date" (change)="onDateChange($event, 'end')" />
  </div>
</div>

<!-- Charts Section -->
<div class="charts-container">
  <div class="column-chart">
    <app-column-chart
      *ngIf="selectedReport === 'monthly'"
      [selectedDivision]="selectedDivision"
      [selectedPC]="selectedPC"
      [startDate]="startDate"
      [endDate]="endDate">
    </app-column-chart>

    <app-report-table 
      *ngIf="selectedReport === 'employeeReport' || selectedReport === 'drawingReport'"
      [reportType]="selectedReport"
      [employeeId]="selectedEmpId" 
      [drawingId]="selectedDrawingId" 
      [startDate]="startDate"
      [endDate]="endDate">
    </app-report-table>

    <app-line-chart 
      *ngIf="selectedReport === 'trend'"
      [selectedDivision]="selectedDivision"
      [selectedPC]="selectedPC"
      [startDate]="startDate"
      [endDate]="endDate">
    </app-line-chart>

    <app-table 
      *ngIf="selectedReport === 'passRatio'"
      [selectedDivision]="selectedDivision"
      [selectedPC]="selectedPC"
      [startDate]="startDate"
      [endDate]="endDate">
    </app-table>
  </div>

  <div class="bar-chart">
    <app-bar-chart 
      *ngIf="selectedReport === 'monthly' || selectedReport === 'trend'"
      [reportType]="selectedReport"
      [selectedDivision]="selectedDivision"
      [selectedPC]="selectedPC"
      [startDate]="startDate"
      [endDate]="endDate">
    </app-bar-chart>

    <app-report-charts 
      *ngIf="selectedReport === 'employeeReport' || selectedReport === 'drawingReport'" 
      [reportType]="selectedReport" 
      [employeeId]="selectedEmpId" 
      [drawingId]="selectedDrawingId"
      [startDate]="startDate"
      [endDate]="endDate">
    </app-report-charts>
  </div>
</div>
