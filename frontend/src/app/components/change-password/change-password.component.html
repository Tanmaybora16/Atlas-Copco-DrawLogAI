<div class="container">
  <div class="sub-container">
    <form #changePasswordForm="ngForm" (ngSubmit)="onSubmit(changePasswordForm)">
      <h1>Change Password</h1>

      <div class="input-container">
        <label for="currentPassword">Current Password</label>
        <div class="password-wrapper">
          <input
            [type]="currentPasswordVisible ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            required
            [disabled]="isBusy"
          />
          <img
            [src]="currentPasswordVisible ? '/assets/eye.svg' : '/assets/eye-off.svg'"
            (click)="!isBusy && togglePasswordVisibility('current')"
            class="eye-icon"
            alt="Toggle Password"
          />
        </div>
      </div>

      <div class="input-container">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input
            [type]="newPasswordVisible ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            [disabled]="isBusy"
          />
          <img
            [src]="newPasswordVisible ? '/assets/eye.svg' : '/assets/eye-off.svg'"
            (click)="!isBusy && togglePasswordVisibility('new')"
            class="eye-icon"
            alt="Toggle Password"
          />
        </div>
      </div>

      <div class="input-container">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-wrapper">
          <input
            [type]="confirmPasswordVisible ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            [disabled]="isBusy"
          />
          <img
            [src]="confirmPasswordVisible ? '/assets/eye.svg' : '/assets/eye-off.svg'"
            (click)="!isBusy && togglePasswordVisibility('confirm')"
            class="eye-icon"
            alt="Toggle Password"
          />
        </div>
      </div>

      <button type="submit" [disabled]="isBusy || !changePasswordForm.valid">
        <ng-container *ngIf="!isBusy; else loadingTpl">Change Password</ng-container>
      </button>
      <ng-template #loadingTpl>Changing…</ng-template>

      <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>
  </div>
</div>
