<header>
  <nav>
    <img src="assets/logo.png" alt="Logo" />
    <img src="assets/IQPulse.png" alt="Logo" />

    <div class="headerLinks">

      <!-- HR-only -->
      <a *ngIf="isLoggedIn() && userRole === 'HR'" routerLink="/employee" routerLinkActive="active-link">Employees</a>

      <a *ngIf="isLoggedIn() && userRole === 'HR'" routerLink="/structure" routerLinkActive="active-link">Structure</a>
      <a *ngIf="isLoggedIn() && userRole === 'HR'" routerLink="/cadq-config" routerLinkActive="active-link">Checklist Config</a>

      <!-- Employee-only -->

      <a *ngIf="isLoggedIn() && userRole === 'Employee'" routerLink="/submission" routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }">Submission</a>

      <a *ngIf="isLoggedIn() && userRole === 'Employee'" routerLink="/requests"
        routerLinkActive="active-link">Requests</a>

      <a *ngIf="isLoggedIn() && userRole === 'Employee'" routerLink="/canvas" routerLinkActive="active-link">Canvas</a>

      <a *ngIf="isLoggedIn() && userRole === 'Employee'" routerLink="/uploads"
        routerLinkActive="active-link">Uploads</a>

      <!-- Both roles -->
      <a *ngIf="isLoggedIn()" routerLink="/reports" routerLinkActive="active-link">Reports</a>

    </div>

    <div class="profile-container" *ngIf="authService.isLoggedIn(); else guestBlock">
      <!-- Support Button  -->
      <a (click)="openSupportModal()" class="support-nav-btn">Support</a>

      <div class="profile">
        <div class="profile-toggle" (click)="toggleProfileDropdown()">
          <div class="profile-icon-wrapper">
            <img class="profile-icon" src="/assets/user.svg" alt="User Icon" />
          </div>
          <p>{{ loggedInUser }}</p>
          <span class="role" [ngClass]="userRole">{{ userRole }}</span>
        </div>

        <div class="dropdown" *ngIf="showDropdown">
          <div class="list-container">
            <a (click)="changePassword()">Change Password</a>
            <a (click)="logout()">
              <img class="list-icon" src="/assets/log-out.svg" alt="" /> Logout
            </a>
          </div>
        </div>
      </div>
    </div>

    <ng-template #guestBlock>
      <div class="profile">
        <button type="button" (click)="navigateToAdmin()">Login</button>
      </div>
    </ng-template>
  </nav>
</header>

<!-- Support Modal Overlay -->
<div class="modal-overlay" *ngIf="showSupportModal" (click)="closeSupportModal()">
  <div class="support-modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0092BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h3>Support & Feedback</h3>
      </div>
      <button class="close-btn" (click)="closeSupportModal()">&times;</button>
    </div>

    <form (ngSubmit)="submitSupport()" class="support-form">
      <div class="form-group">
        <label for="sup-name">Name <span class="required">*</span></label>
        <input id="sup-name" type="text" [(ngModel)]="supportData.name" name="name" placeholder="Enter your full name" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="sup-empid">Emp ID <span class="required">*</span></label>
          <input id="sup-empid" type="text" [(ngModel)]="supportData.emp_id" name="emp_id" placeholder="e.g. EMP_07" required />
        </div>

        <div class="form-group">
          <label for="sup-team">Team</label>
          <input id="sup-team" type="text" [(ngModel)]="supportData.team" name="team" placeholder="e.g. TSG 2" />
        </div>
      </div>

      <div class="form-group">
        <label for="sup-message">Message <span class="required">*</span></label>
        <textarea id="sup-message" [(ngModel)]="supportData.message" name="message" rows="4" placeholder="Type your issue, feedback, or question here..." required></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeSupportModal()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isSubmittingSupport">
          <span *ngIf="!isSubmittingSupport">Submit</span>
          <span *ngIf="isSubmittingSupport">Submitting...</span>
        </button>
      </div>
    </form>
  </div>
</div>
