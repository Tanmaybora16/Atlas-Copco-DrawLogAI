<div class="container">
    <div class="btn-container">
        <!-- ✅ Excel Download Button -->
        <button class="download-button" (click)="downloadExcel()">
            <img class="button-icon" src="/assets/download.svg" alt=""> Excel
        </button>
    
        <!-- ✅ PDF Download Button -->
        <button class="download-button" (click)="downloadPDF()">
            <img class="button-icon" src="/assets/download.svg" alt=""> PDF
        </button>
    </div>
    
    <div class="table-container">
        <table class="styled-table">
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Month</th>
                    <th *ngIf="showDivisionPC">Division</th>
                    <th *ngIf="showDivisionPC">PC</th>
                    <th>No of drawing</th>
                    <th>Pass Ratio</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of passRatioData">
                    <td>{{ row.year }}</td>
                    <td>{{ row.month }}</td>
                    <td *ngIf="showDivisionPC">{{ selectedDivision }}</td>
                    <td *ngIf="showDivisionPC">{{ selectedPC }}</td>
                    <td>{{ row.total_drawings }}</td>
                     <!-- ✅ Apply Dynamic Color for Pass Ratio -->
    <td [ngClass]="getPassRatioClass(row.pass_ratio)">{{ row.pass_ratio }}</td>
    
    <!-- ✅ Apply Dynamic Color for Count -->
    <td [ngClass]="getPassRatioClass(row.pass_ratio)">{{ row.accepted_drawings }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
